# Релиз по тегу: `git tag v0.2.0 && git push origin v0.2.0` собирает пакеты
# для Linux и Windows и APK для Android и складывает их в черновик релиза на
# GitHub. Черновик публикуется руками — после того как его посмотрели.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Ключ подписи проверяется первым и за минуту: раньше неверный пароль
  # всплывал только в задаче android, после двадцати минут сборки.
  signing:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # Пароль — из окружения (`:env`): в командной строке его видно в
          # списке процессов.
          if ! "${JAVA_HOME:+$JAVA_HOME/bin/}keytool" -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the ANDROID_KEYSTORE_BASE64 keystore (or it has no ANDROID_KEY_ALIAS key)"
            exit 1
          fi
          rm "$RUNNER_TEMP/release.jks"

  build:
    needs: signing
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04: cpal собирает PipeWire из заголовков, а в 22.04 они слишком
          # старые. Цена — пакеты требуют glibc 2.39 (Ubuntu 24.04, Debian 13,
          # Fedora 40 и новее, Arch).
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
          # MSI собирается на русском (кодовая страница 1251): в описаниях
          # кириллица, а английский MSI с 1252 на ней падает. NSIS берёт
          # язык системы — русский или английский.
          - os: windows-latest
            bundles: nsis,msi --verbose
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libdbus-1-dev libasound2-dev libpipewire-0.3-dev libclang-dev cmake file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Описание релиза — раздел этой версии из CHANGELOG.md.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md)
          [ -z "$notes" ] && notes="See CHANGELOG.md."
          {
            echo "body<<NOTES_EOF"
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy для AppImage сам — AppImage, а FUSE на раннере нет.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Его встроенный strip старый и спотыкается о секцию .relr.dyn
          # свежих библиотек.
          NO_STRIP: true
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ringloft ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  # APK для Android: один файл на обе архитектуры ARM, подписанный ключом из
  # секретов репозитория. Идёт после десктопных сборок: черновик релиза к
  # этому моменту уже создан, и APK просто докладывается в него. Создавать
  # черновик наперегонки нельзя — у одного тега их получилось бы два.
  android:
    needs: build
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-release

      - name: Android NDK
        run: |
          # `yes` обрывается, когда sdkmanager закончил, — это не ошибка;
          # получилось или нет, видно по самой папке.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null || true
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - run: npm ci

      # Ключ живёт в секретах, в репозитории его нет (проверен задачей
      # signing). Без него сборка не идёт: неподписанный APK телефон не
      # поставит, а подписанный другим ключом не обновит уже установленное
      # приложение.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Пароли — окружением, а не файлом keystore.properties: в файле Gradle
      # читает `\` как экранирование (см. app/build.gradle.kts). Пустой
      # пароль ключа значит «тот же, что у хранилища».
      - name: Release APK
        env:
          RINGLOFT_KEYSTORE: ${{ runner.temp }}/release.jks
          RINGLOFT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RINGLOFT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RINGLOFT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android -- build --apk --target aarch64 --target armv7

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          apk="Ringloft_${version}_android.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          echo "file=$apk" >> "$GITHUB_OUTPUT"

      # Всегда — артефактом сборки: ручной запуск без тега тоже должен
      # отдавать APK на проверку.
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Add to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" --clobber
